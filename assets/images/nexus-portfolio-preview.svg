<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">NEXUS — Portafolio tecnológico</title><desc id="desc">Vista conceptual de un portafolio oscuro con identidad NEXUS, tipografía tecnológica y una composición orbital 3D.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b13"/><stop offset="1" stop-color="#101d31"/></linearGradient><linearGradient id="cyan"><stop stop-color="#69e2e7"/><stop offset="1" stop-color="#829bff"/></linearGradient><radialGradient id="orb"><stop stop-color="#69e2e7" stop-opacity=".38"/><stop offset=".55" stop-color="#173a55" stop-opacity=".7"/><stop offset="1" stop-color="#09111d"/></radialGradient></defs><rect width="1440" height="900" fill="url(#bg)"/><g opacity=".16" stroke="#6c8ba8"><path d="M0 100H1440M0 200H1440M0 300H1440M0 400H1440M0 500H1440M0 600H1440M0 700H1440M0 800H1440"/><path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900"/></g><rect x="56" y="42" width="1328" height="816" rx="26" fill="#091321" stroke="#29435d"/><text x="100" y="112" fill="#eef5ff" font-family="Arial" font-size="27" font-weight="700" letter-spacing="5">NEXUS<tspan fill="#69e2e7">.</tspan></text><text x="1335" y="110" fill="#9caec3" font-family="Arial" font-size="14" text-anchor="end">ÁREAS　 PROYECTOS　 PROCESO　 CONTACTO</text><path d="M100 145H1340" stroke="#29435d"/><text x="105" y="225" fill="#69e2e7" font-family="Arial" font-size="16" letter-spacing="5">PORTAFOLIO TECNOLÓGICO / REPÚBLICA DOMINICANA</text><text x="105" y="315" fill="#f5f8ff" font-family="Arial" font-size="72" font-weight="700">TECNOLOGÍA</text><text x="105" y="397" fill="url(#cyan)" font-family="Arial" font-size="72" font-weight="700">QUE CONECTA IDEAS.</text><text x="110" y="463" fill="#a8b8cc" font-family="Arial" font-size="22">Proyectos web · Redes · Automatización · Seguridad informática</text><rect x="108" y="520" width="255" height="60" rx="12" fill="url(#cyan)"/><text x="235" y="558" fill="#07111b" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">EXPLORAR PROYECTOS ↗</text><circle cx="1045" cy="500" r="235" fill="url(#orb)" stroke="#294b68"/><ellipse cx="1045" cy="500" rx="285" ry="105" fill="none" stroke="#69e2e7" stroke-opacity=".8" stroke-width="2" transform="rotate(-24 1045 500)"/><ellipse cx="1045" cy="500" rx="120" ry="275" fill="none" stroke="#829bff" stroke-opacity=".7" stroke-width="2" transform="rotate(28 1045 500)"/><circle cx="1045" cy="500" r="88" fill="#0c1b2b" stroke="#69e2e7" stroke-opacity=".8"/><text x="1045" y="520" fill="#f5f8ff" font-family="Arial" font-size="76" font-weight="700" text-anchor="middle">N<tspan fill="#69e2e7">.</tspan></text><text x="1045" y="615" fill="#9cb2ca" font-family="Arial" font-size="14" text-anchor="middle" letter-spacing="4">DIGITAL PROJECTS</text><text x="110" y="760" fill="#69e2e7" font-family="Arial" font-size="14" letter-spacing="4">DISEÑO · DESARROLLO · APRENDIZAJE CONTINUO</text><text x="110" y="802" fill="#7f93aa" font-family="Arial" font-size="16">Una identidad digital construida alrededor de proyectos reales.</text></svg>